name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the example env (test Turnstile key, no analytics)
        run: cp apps/web/.env.example apps/web/.env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter web build
      - run: pnpm -r test
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: PUBLIC_TURNSTILE_SITE_KEY=1x00000000000000000000AA
      - name: Build contact-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/contact-api/Dockerfile
          push: false

  publish:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/brx-solutions/web:${{ github.sha }}
          build-args: |
            PUBLIC_TURNSTILE_SITE_KEY=${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
            PUBLIC_UMAMI_SRC=https://stats.brxsolutions.sk/script.js
            PUBLIC_UMAMI_WEBSITE_ID=${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish contact-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/contact-api/Dockerfile
          push: true
          tags: ghcr.io/brx-solutions/contact-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
