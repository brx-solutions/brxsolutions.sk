# Base stack: Caddy (static site + /api proxy) and the contact API. No published ports here.
# Local:      docker compose -f docker-compose.yml -f compose.local.yml up
# Production: docker compose -f docker-compose.yml -f compose.prod.yml up -d
services:
  web:
    image: ghcr.io/brx-solutions/web:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
        PUBLIC_UMAMI_SRC: ${PUBLIC_UMAMI_SRC:-}
        PUBLIC_UMAMI_WEBSITE_ID: ${PUBLIC_UMAMI_WEBSITE_ID:-}
    environment:
      STATS_ORIGIN: ${STATS_ORIGIN:-}
    mem_limit: 128m
    depends_on:
      # service_started, not service_healthy: Caddy serves the static site regardless of
      # the API; waiting for the API healthcheck kept the site down ~30 s on every deploy.
      contact-api:
        condition: service_started
    restart: unless-stopped

  contact-api:
    image: ghcr.io/brx-solutions/contact-api:${IMAGE_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/contact-api/Dockerfile
    env_file: .env
    environment:
      PORT: 3000
    mem_limit: 192m
    restart: unless-stopped
